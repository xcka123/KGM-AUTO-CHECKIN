name: 仓库保活

on:
  schedule:
    # 每月1号凌晨1点自动执行（避开GitHub高峰期）
    - cron: '0 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          echo "This file is automatically updated to keep the repository active." > .github/KEEPALIVE.md
          echo "" >> .github/KEEPALIVE.md
          echo "Last Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .github/KEEPALIVE.md

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/KEEPALIVE.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keepalive update [skip ci]"
            git push
          fi
